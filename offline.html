<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>離線中 — 完整加註版奇蹟課程</title>
<style>
  :root {
    --bg: #1A0C30;
    --bg2: #2D1B4E;
    --gold: #C9A227;
    --purple-lt: #C9A8E8;
    --text: #EDE6F8;
    --muted: rgba(201,168,232,0.55);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: linear-gradient(145deg, var(--bg2) 0%, var(--bg) 100%);
    color: var(--text);
    font-family: 'PingFang TC', 'Noto Serif TC', 'Microsoft JhengHei', serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    text-align: center;
    padding: 2rem 1.5rem;
    max-width: 360px;
  }
  /* 新的圖片容器和圖片樣式，替換舊的 CSS 圖示 */
  .star-img-container {
    width: 80px; /* 從原始 72px 放大，以更符合圖示比例 */
    height: 80px;
    margin: 0 auto 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    /* 移除原本的不透明度，讓圖片清晰 */
  }
  .star-img {
    width: 100%;
    height: 100%;
    object-fit: contain; /* 保持比例 */
    opacity: 0.85; /* 適當增加一些不透明度，使其更自然 */
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 500;
    color: var(--text);
    margin-bottom: .6rem;
    letter-spacing: .05em;
  }
  .subtitle {
    font-size: .85rem;
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 2rem;
  }
  .gold-line {
    width: 60px; height: 1.5px;
    background: var(--gold);
    margin: 1.25rem auto;
    border-radius: 1px;
    opacity: .7;
  }
  .btn {
    display: inline-block;
    padding: .65rem 1.5rem;
    background: rgba(107,47,160,0.45);
    border: 1px solid rgba(201,162,39,0.45);
    border-radius: 24px;
    color: var(--text);
    font-size: .9rem;
    cursor: pointer;
    text-decoration: none;
    transition: background .2s;
    font-family: inherit;
  }
  .btn:hover { background: rgba(107,47,160,0.7); }
  .hint {
    margin-top: 1.25rem;
    font-size: .75rem;
    color: var(--muted);
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="container">
  <div class="star-img-container">
    <img src="pwa-192x192.png" alt="奇蹟課程星芒圖示" class="star-img">
  </div>
  <h1>目前處於離線狀態</h1>
  <div class="gold-line"></div>
  <p class="subtitle">
    無法連線至網路，<br>
    且此頁面尚未存入離線快取。<br>
    請確認網路連線後再試。
  </p>
  <button class="btn" onclick="window.history.back()">← 返回上一頁</button>
  <p class="hint">
    若曾連線開啟過主頁，<br>
    可嘗試直接開啟已快取的內容。
  </p>
</div>
</body>
</html>
