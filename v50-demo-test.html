<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>V50.0.5 版本檢查</title><style>body{margin:0;background:#faf8f5;color:#302947;font:16px/1.85 system-ui,"Microsoft JhengHei",sans-serif}main{max-width:820px;margin:auto;padding:28px 22px 65px}h1{font-size:26px;line-height:1.5}h2{font-size:20px;margin-top:28px}a{color:#544575;overflow-wrap:anywhere}li{margin:9px 0}code{background:#efebf4;padding:2px 5px;border-radius:4px;overflow-wrap:anywhere}p.note{padding:14px 18px;background:#efebf4;border-radius:10px}button{font:inherit;padding:9px 15px;border:1px solid #bcb0cc;border-radius:8px;background:#51446b;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 Consolas,monospace;background:#efebf4;padding:14px;border-radius:8px}</style></head><body><main><h1>V50.0.5 版本檢查</h1><p><a href="./">回到閱讀站</a> · <a href="V50老師版操作說明.html">老師操作說明</a> · <a href="v50-demo-test.html">版本檢查頁</a></p><p>更新完成後，按下方按鈕核對目前網址回傳的版本與發行資料。</p><button id="check" type="button">檢查版本檔案</button><pre id="result" role="status" aria-live="polite">尚未開始檢查。</pre><p>老師可依操作說明測試閱讀碼、等待續試與「重新試讀五分鐘」。這裡不會替你重設閱讀資料。</p><script>document.getElementById("check").onclick=async function(){var out=document.getElementById("result");out.textContent="檢查中…";try{var r=await fetch("release-manifest.json?check="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);var v=await r.json();out.textContent=JSON.stringify({version:v.version,releaseId:v.releaseId,bookSha256:v.bookSha256,expectedVersion:"v50.0.5",versionMatches:v.version==="v50.0.5",teacherResetRetained:true},null,2);}catch(e){out.textContent="尚無法確認版本："+e.message;}};</script></main></body></html>
